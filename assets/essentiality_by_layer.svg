<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">LOAM essentiality AUROC by layer</title>
<desc id="d">Line chart of macro mean AUROC on BacBench gene essentiality at every probed layer of the four LOAM models, against relative depth. All four start near 0.48 at the embedding layer, rise steeply in the first layers and reach 0.73 to 0.77 at depth; the dashed line is the k-mer floor, 0.6531.</desc>
<style>
  text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #29332E; font-size: 12px; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; }
  .muted { fill: #5E6A64; }
  .title { font-size: 14px; font-weight: 600; }
  .axis { stroke: #29332E; stroke-width: 1; }
  .grid { stroke: #29332E; stroke-opacity: 0.12; stroke-width: 1; }
  .floor { stroke: #5E6A64; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .link { stroke: #5E6A64; stroke-opacity: 0.5; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    text { fill: #E6E9E7; } .muted { fill: #A3ADA8; }
    .axis { stroke: #E6E9E7; } .grid { stroke: #E6E9E7; }
    .floor, .link { stroke: #A3ADA8; }
  }
</style>
