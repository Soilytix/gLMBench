<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
<title id="t">Last-layer vs best-layer probe scores</title>
<desc id="d">Dot plot of the 13 models, LOAM first then the comparators by size. For gene essentiality AUROC and enzyme-class macro-F1 each model shows its last-layer score (filled) and its best-tap score (ring); the dashed lines are the k-mer floors. On EC most comparators sit near the floor at their last layer and gain mostly at an intermediate tap; LOAM's last-layer EC scores are 0.18 to 0.30.</desc>
<style>
  text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #29332E; font-size: 12px; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; }
  .muted { fill: #5E6A64; }
  .title { font-size: 14px; font-weight: 600; }
  .axis { stroke: #29332E; stroke-width: 1; }
  .grid { stroke: #29332E; stroke-opacity: 0.12; stroke-width: 1; }
  .floor { stroke: #5E6A64; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .link { stroke: #5E6A64; stroke-opacity: 0.5; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    text { fill: #E6E9E7; } .muted { fill: #A3ADA8; }
    .axis { stroke: #E6E9E7; } .grid { stroke: #E6E9E7; }
    .floor, .link { stroke: #A3ADA8; }
  }
</style>
