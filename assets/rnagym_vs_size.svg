<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="t d">
<title id="t">RNAGym Spearman vs parameters</title>
<desc id="d">Scatter of RNAGym Spearman correlation, averaged over 11 assays with no training, against measured parameter count on a log scale. LOAM models (green, joined by a line) rise from 0.13 at 25M to 0.32 at 624M; Evo 1.5 and Evo2-7B, about ten times larger, reach 0.32 and 0.34. Masked models are scored by masked-marginal LLR, causal ones by log-likelihood.</desc>
<style>
  text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #29332E; font-size: 12px; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 11px; }
  .muted { fill: #5E6A64; }
  .title { font-size: 14px; font-weight: 600; }
  .axis { stroke: #29332E; stroke-width: 1; }
  .grid { stroke: #29332E; stroke-opacity: 0.12; stroke-width: 1; }
  .floor { stroke: #5E6A64; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .link { stroke: #5E6A64; stroke-opacity: 0.5; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    text { fill: #E6E9E7; } .muted { fill: #A3ADA8; }
    .axis { stroke: #E6E9E7; } .grid { stroke: #E6E9E7; }
    .floor, .link { stroke: #A3ADA8; }
  }
</style>
