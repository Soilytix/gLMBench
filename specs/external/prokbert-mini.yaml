# ProkBERT-mini: the base ProkBERT checkpoint, a BERT-style masked-LM encoder (20.6M params:
# 6 layers, 384 dim, 6 heads) with an LCA k-mer tokenizer (k=6, shift=1: overlapping 6-mers).
# Serves embeddings and masked-marginal LLR; causal capabilities are N/A for an encoder.
# Loaded with trust_remote_code on transformers 5.x, WITHOUT the `prokbert` pip package
# (it pins an incompatible transformers).
adapter: prokbert
adapter_version: "0.2.0"
display_name: "ProkBERT-mini"
model:
  checkpoint: "neuralbioinfo/prokbert-mini"   # Hub repo id (or a local download dir)
  n_layers: 6                                  # config.json `num_hidden_layers`; not hashed
  tokenizer: null                              # null -> same as checkpoint
  revision: "feb2520a43cd9cdb5b3d8477e47209dbcb55d1dc"        # weights commit (load + hash key)
  code_revision: "366d9336b6b89d7c1feddf56d9b01be8065ccc43"   # neuralbioinfo/nbrg-transformers remote code
  dtype: bfloat16                              # the runner uses fp32 on CPU
  trust_remote_code: true                      # custom ProkBERT architecture
  pool_include_special: false                  # exclude [CLS]/[SEP] from pooling
  max_context: 1020                            # nucleotides (tasks window by this); <= 1024 tokens
  max_tokens: 1024                             # trained window == max_position_embeddings
  batch_size: 16
weights_digest:
  strategy: hf_revision
  value: "feb2520a43cd9cdb5b3d8477e47209dbcb55d1dc"
runner:
  backend: local
  python_exe: "${GLMBENCH_PYTHON:-python}"   # an env with glmbench + torch + transformers
  gpus: "0"
  scratch_dir: null
  extra: {}
