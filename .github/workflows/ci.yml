name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # The CPU unit suite on the paper's pinned core versions. Tests that need a GPU, the
    # network or remote model code skip themselves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hf,dev]" -c envs/constraints-paper.txt \
              --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Paper reference table is up to date
        run: python scripts/build_reference_table.py --check
